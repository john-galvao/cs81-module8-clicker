<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cookie Clicker</title>
</head>

<body style="font-family: sans-serif; text-align: center; padding-top: 60px;">
  <h1>Cookie Clicker</h1>

  <button id="cookieBtn">🍪</button>

  <div>
    Cookies: <span id="count">0</span>
  </div>

  <div id="message">
    Click the cookie to start!
  </div>

  <script>
    const cookieBtn = document.getElementById("cookieBtn");
    const countSpan = document.getElementById("count");
    const messageDiv = document.getElementById("message");

    let clicks = 0;

    cookieBtn.addEventListener("click", () => {
      clicks++;
      countSpan.textContent = clicks;

      if (clicks === 10) {
        messageDiv.textContent = "You’re just getting started";
        document.body.style.backgroundColor = "#fff3cd";
      } else if (clicks === 25) {
        messageDiv.textContent = "Wow, that’s a lot of cookies";
        document.body.style.backgroundColor = "#d1ecf1";
      } else if (clicks === 50) {
        messageDiv.textContent = "Are you still clicking?";
        document.body.style.backgroundColor = "#d4edda";
      } else if (clicks === 100) {
        messageDiv.textContent = "You win! Maybe take a break";
        document.body.style.backgroundColor = "#f8d7da";
      }
    });
  </script>
</body>
</html>
